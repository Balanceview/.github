name: Dependency audit and secret scan

# Shared by every Balanceview repo: bump the gitleaks pin here once. Needs no secrets.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Audit and scan
    # GitHub-hosted: about 1 minute, and the PC runners are often off.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the v8.30.1 release.
      GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Composer audit
        if: ${{ hashFiles('composer.lock') != '' }}
        run: composer audit --locked --no-interaction --abandoned=report

      - name: npm audit
        if: ${{ !cancelled() && hashFiles('package-lock.json') != '' }}
        run: npm audit --omit=dev --audit-level=high

      # Report-only until each repo's first findings are triaged; remove this line to make it block.
      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=x64;   sha="$GITLEAKS_SHA256_X64" ;;
            aarch64) arch=arm64; sha="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "Unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          file="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${sha}  $dir/$file" | sha256sum -c -
          tar -xzf "$dir/$file" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --verbose .
